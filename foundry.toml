# foundry.toml
#
# Solc, optimizer, and EVM version are pinned to MATCH BALANCER V3 MAINNET EXACTLY.
# From verified Etherscan source of VaultFactory (0xAc27df81663d139072E615855eF9aB0Af3FBD281):
#   - Compiler: v0.8.26+commit.8a97fa7a
#   - Optimization: enabled, 9999 runs
#   - EVM version: cancun
#
# Do not change these values without a corresponding decision documented in
# docs/STAGE_A_PLAN.md. The audit-inheritance argument for the un-modified
# Vault/VaultAdmin/VaultExtension bytecode depends on byte-level toolchain parity.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc = "0.8.26"
optimizer = true
optimizer_runs = 9999
via_ir = true
evm_version = "cancun"

# Metadata controls — keep bytecode-only outputs stable across machines
bytecode_hash = "none"
cbor_metadata = false

# PB-D33: `script/DeployAureumVault.s.sol` reads the Vault creation codes from the
# artifacts built by `FOUNDRY_PROFILE=vault forge build`, which needs read access here.
#
# PB-D37 (vi): `test/unit/BytecodeSize.t.sol` walks `src/` with `vm.readDir` to assert that
# the hand-listed contract roster still covers every source file, which needs read access
# to `./src`.
fs_permissions = [
    { access = "read", path = "./out-vault" },
    { access = "read", path = "./src" },
]

# Test verbosity defaults
verbosity = 2

[profile.default.fuzz]
runs = 1024
max_test_rejects = 65536

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false

# Heavier CI profile — invoke with `FOUNDRY_PROFILE=ci forge test`
[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 1024, depth = 512 }

# Formatter config
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = false
ignore = ["lib/**"]

# B3: `AureumVaultFactory` preserves upstream Balancer `VaultFactory` camelCase immutables to keep the fork diff
# minimal; forge lint would otherwise emit `screaming-snake-case-immutable` notes on those lines only.
# See docs/STAGE_B_NOTES.md (Plan divergences, B3).
#
# B4: `AureumProtocolFeeController` preserves upstream Balancer `ProtocolFeeController` code patterns
# byte-for-byte where semantically identical. Forge lint would otherwise emit three categories of notes,
# all attributable to upstream's own design choices that the fork deliberately preserves to keep the
# audit-inheritance diff minimal:
#   (a) `divide-before-multiply` on the precision-truncation idiom
#       `(x / FEE_SCALING_FACTOR) * FEE_SCALING_FACTOR` used in two places. The divide-then-multiply
#       is the point — it truncates to a precision boundary — and is deliberate upstream arithmetic.
#   (b) `unused-import` on `MAX_FEE_PERCENTAGE` from `VaultTypes.sol`. The import is unused in upstream
#       and remains unused in the fork; removing it would be a gratuitous divergence.
#   (c) `unwrapped-modifier-logic` on the three inline modifier bodies for `withValidSwapFee`,
#       `withValidYieldFee`, and `withValidPoolCreatorFee`. Upstream writes them inline; wrapping them
#       into internal helper functions would save a few bytes of bytecode at the cost of byte-level
#       divergence from upstream for no runtime benefit.
# See docs/STAGE_B_NOTES.md (B4 implementation notes) for the per-note line-number snapshot.
[lint]
ignore = ["src/vault/AureumVaultFactory.sol", "src/vault/AureumProtocolFeeController.sol"]

# RPC endpoints pulled from .env
[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

# Etherscan verification (Stage C)
[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }

# ---------------------------------------------------------------------------
# PB-D33 option C — the Balancer vault build.
#
# `Vault.sol` overruns the EIP-170 24,576-byte limit under this project's default
# settings and cannot be deployed at all. Balancer compiled their mainnet Vault at
# 500 optimizer runs WITH an explicit Yul optimizer step sequence; the step sequence
# alone is worth 782 bytes and is what brings the artifact under the limit. Verified
# against the Sourcify `exact_match` standard-json input for the deployed Vault at
# 0xbA1333333333a1BA1108E8412f11850A5C319bA9.
#
# These settings are deliberately CONFINED to this profile. Applying them project-wide
# was tried and rejected: it compiles `src/` and `script/` correctly but breaks the test
# tree with an unattributable Yul stack-too-deep exception, and at 9999 runs it is
# computationally intractable at this tree's size. See docs/STAGE_P_BIS_NOTES.md PB-D33.
#
# Build with:  FOUNDRY_PROFILE=vault forge build
# Consumed by: script/DeployAureumVault.s.sol via vm.getCode()
#
# Keys under optimizer_details are camelCase, NOT snake_case. Foundry drops multi-word
# snake_case keys here SILENTLY — no error, no warning — and the only symptom is a
# larger artifact. Verify any change with `forge build --build-info`, which writes the
# literal standard-json handed to solc.
# ---------------------------------------------------------------------------
[profile.vault]
src = "lib/balancer-v3-monorepo/pkg/vault/contracts"
out = "out-vault"
test = "lib/balancer-v3-monorepo/pkg/vault/contracts"
script = "lib/balancer-v3-monorepo/pkg/vault/contracts"
# solc 0.8.30, NOT the project's 0.8.26. At 500 runs with the step sequence below,
# 0.8.26 raises an internal compiler error ("Assembly exception for bytecode") on this
# tree — at every scope tried, down to Vault.sol's own closure. Balancer's own source
# compiles fine at these exact settings, so the trigger is our submodule revision, which
# PB-D33 (viii) already records as drifted. 0.8.30 compiles the package cleanly. The
# version delta is worth 2 bytes on Vault, measured. [profile.default] stays on 0.8.26.
solc = "0.8.30"
optimizer = true
optimizer_runs = 500
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
[profile.vault.optimizer_details]
peephole = true
inliner = true
jumpdestRemover = true
orderLiterals = true
deduplicate = true
cse = true
constantOptimizer = true
yul = true
simpleCounterForLoopUncheckedIncrement = true
[profile.vault.optimizer_details.yulDetails]
stackAllocation = true
optimizerSteps = "dhfoDgvulfnTUtnIf [ xa[r]EscLM cCTUtTOntnfDIul Lcul Vcul [j] Tpeul xa[rul] xa[r]cL gvif CTUca[r]LSsTFOtfDnca[r]Iulc ] jmul[jul] VcTOcul jmul : fDnTOcmu"
